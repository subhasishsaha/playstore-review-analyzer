services:
  # Official Ollama LLM Service
  ollama:
    image: ollama/ollama:latest
    container_name: playstore-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - playstore-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Automated Model Puller: pulls default qwen3.5:0.8b model once Ollama is ready
  ollama-model-init:
    image: curlimages/curl:latest
    container_name: playstore-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - playstore-net
    entrypoint: ["sh", "-c", "curl -s -X POST http://ollama:11434/api/pull -d '{\"model\": \"qwen3.5:0.8b\"}'"]
    restart: "no"

  # Play Store Review Analyzer Web Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: playstore-review-analyzer:latest
    container_name: playstore-analyzer-web
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen3.5:0.8b
      - PORT=8000
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - playstore-net
    restart: unless-stopped

volumes:
  ollama_models:
    name: playstore_ollama_models

networks:
  playstore-net:
    driver: bridge
